# Lint config for CI (Phase 2.2).
line-length = 110
target-version = "py311"

[lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "SIM", # simplify
]
ignore = [
    "E501",   # line-length handled separately; prefer readable tables
    "B008",   # FastAPI Depends uses function defaults intentionally
    "B904",   # explicit `raise ... from None` is noisy in handlers
]

[lint.per-file-ignores]
"alembic/versions/*" = ["E", "F", "I"]
"tests/*" = ["B", "SIM"]
