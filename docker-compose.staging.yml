# Staging overlay: extends docker-compose.dev.yml with MLflow tracking +
# MinIO (S3-compatible) artifact store so experiment runs, params, metrics,
# and model files live somewhere reproducible. Use with:
#
#   docker compose -f docker-compose.dev.yml -f docker-compose.staging.yml up
#
# The backend reads MLFLOW_TRACKING_URI; training scripts under ai/ set
# the same variable so local runs and containerised runs hit the same server.

services:
  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: mlflow
      MINIO_ROOT_PASSWORD: mlflow-staging-secret
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    volumes:
      - gs_minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot bootstrap: creates the ``mlflow`` bucket if missing. Without
  # this, the first run fails with a 404 because MLflow doesn't create
  # artifact buckets on demand.
  minio-bootstrap:
    image: minio/mc:RELEASE.2024-10-08T09-37-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 mlflow mlflow-staging-secret &&
      mc mb --ignore-existing local/mlflow &&
      echo 'MinIO bucket mlflow ready.'
      "

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.18.0
    depends_on:
      postgres:
        condition: service_healthy
      minio-bootstrap:
        condition: service_completed_successfully
    environment:
      # Backend store: reuse the staging Postgres. MLflow creates its own
      # ``mlflow`` schema on first boot.
      MLFLOW_BACKEND_STORE_URI: postgresql://geosentinel:geosentinel@postgres:5432/geosentinel
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: mlflow
      AWS_SECRET_ACCESS_KEY: mlflow-staging-secret
      # Default artifact root; per-experiment roots inherit from this.
      MLFLOW_ARTIFACTS_DESTINATION: s3://mlflow/
    command: >
      bash -c "pip install --quiet psycopg2-binary boto3 &&
               mlflow server
               --host 0.0.0.0
               --port 5000
               --backend-store-uri $${MLFLOW_BACKEND_STORE_URI}
               --default-artifact-root s3://mlflow/
               --serve-artifacts"
    ports:
      - "5000:5000"

  # Re-declare backend+celery with MLFLOW_TRACKING_URI injected so any
  # online learning we wire up later logs to the same server.
  backend:
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: mlflow
      AWS_SECRET_ACCESS_KEY: mlflow-staging-secret

  celery-worker:
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: mlflow
      AWS_SECRET_ACCESS_KEY: mlflow-staging-secret

volumes:
  gs_minio:
