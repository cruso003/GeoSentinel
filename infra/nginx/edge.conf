upstream gs_backend {
    server backend:8000;
}

upstream gs_frontend {
    server frontend:80;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Rate limits (wired in §4). Declared at http{} scope via include.
limit_req_zone $binary_remote_addr zone=gs_login:10m rate=5r/m;
limit_req_zone $http_x_gateway_api_key zone=gs_ingest:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=gs_ws:10m;

# Plain-HTTP listener: redirect everything to HTTPS.
server {
    listen 80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2 default_server;
    server_name _;

    # TLS config — mount certificates into /etc/nginx/ssl/{fullchain.pem,privkey.pem}.
    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256';
    ssl_session_cache shared:GS_TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;
    client_max_body_size 25m;

    # Security headers applied to every response from this vhost. Keep them
    # in sync with `docs/roadmap/phase-2.1-security-hardening.md` §3.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
    # CSP tuned for a Vite SPA talking to /api + /ws on the same origin.
    # Leaflet tile host + MapTiler are allow-listed; tweak when you swap
    # providers. No inline or eval'd scripts are permitted.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.basemaps.cartocdn.com https://*.openstreetmap.org https://*.tile.openstreetmap.org; font-src 'self' data:; connect-src 'self' wss: https:; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Login: hard per-IP limit, burst of 3.
    location = /api/v1/auth/login {
        limit_req zone=gs_login burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://gs_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Gateway ingest: keyed by gateway API key header so one noisy device
    # can't starve its peers.
    location = /api/v1/sensors/ingest {
        limit_req zone=gs_ingest burst=60 nodelay;
        limit_req_status 429;
        proxy_pass http://gs_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /api/ {
        proxy_pass http://gs_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # WebSocket: `/ws/{site_id}` — per-IP concurrent connection cap so one
    # client can't hoard hub slots. Upgrade headers required.
    location /ws/ {
        limit_conn gs_ws 20;
        proxy_pass http://gs_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # SPA and everything else.
    location / {
        proxy_pass http://gs_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
